name: Website + Docs
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout website (compiled output)
        uses: actions/checkout@v4
        with:
          repository: kekelp/keru_website
          path: keru_website
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install system dependencies for Parley
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - name: Configure cache
        uses: Swatinem/rust-cache@v2
      - name: Setup pages
        uses: actions/configure-pages@v5
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-Z unstable-options --generate-link-to-definition"
        run: |
          cargo clean --doc
          cargo doc --no-deps
          rm -f target/doc/.lock
      - name: Assemble site
        run: |
          mkdir -p public
          cp -r keru_website/public/. public/
          mkdir -p public/live_docs
          cp -r target/doc/. public/live_docs/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
